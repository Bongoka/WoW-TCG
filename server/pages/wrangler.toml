# Cloudflare Pages "wowtcg" (node bin/cfdeploy.js läuft hier): statische Dateien aus ../../../wowtcg-cfdeploy,
# Funktionen aus functions/ (Online-Server: Durable Objects des Workers wowtcg-net, server/net)
name = "wowtcg"
pages_build_output_dir = "../../../wowtcg-cfdeploy"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"
script_name = "wowtcg-net"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"
script_name = "wowtcg-net"
